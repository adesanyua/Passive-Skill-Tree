modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerUrl="https://github.com/Daripher/Passive-Skill-Tree/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Passive Skill Tree adds an RPG style skill tree system to Minecraft.
'''

[[mixins]]
config="skilltree.mixins.json"

[[dependencies.${mod_id}]]
modId="apothic_attributes"
type="optional"
versionRange="[2.10.1,3)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.5.1,10)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="irons_spellbooks"
type="optional"
versionRange="[1.21.1-3.16.3,1.21.1-4)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
