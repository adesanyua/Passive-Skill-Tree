plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = property('mod_version')
group = property('mod_group_id')

base {
    archivesName = property('mod_id')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = property('neoforge_version')

    // Конфигурации запуска
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', property('mod_id')
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', property('mod_id')
        }
        data {
            data()
            programArguments.addAll '--mod', property('mod_id'),
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${property('mod_id')}" {
            sourceSet sourceSets.main
        }
    }
}

// Генерация папки ресурсов из data-генератора
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top/"
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'Shadows Maven'
        url = 'https://maven.shadowsoffire.dev/releases'
        content { includeGroup 'dev.shadowsoffire' }
    }
    maven {
        name = 'Iron Maven'
        url = 'https://code.redspace.io/releases'
        content { includeGroup 'io.redspace' }
    }
}

dependencies {
    // Optional integrations: available to the compiler, not bundled with the mod.
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}") { transitive = false }
    compileOnly("dev.shadowsoffire:ApothicAttributes:${apothic_attributes_version}") { transitive = false }
    compileOnly("io.redspace:irons_spellbooks:${irons_spellbooks_version}") { transitive = false }
}

// Замена переменных в neoforge.mods.toml
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_group_id           : mod_group_id
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll '-Xmaxerrs', '1000'
}
